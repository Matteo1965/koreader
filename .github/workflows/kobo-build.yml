# Kobo build artifacts use the GitHub Actions run number as the canonical build number.
name: Kobo build
run-name: Kobo build #${{ github.run_number }} – Hungarian typography fixes

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: kobo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kobo:
    name: Kobo ARM build
    runs-on: ubuntu-latest

    env:
      KO_VERSION: v2026.07.2-1-g${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply Hungarian Kobo build 3 fixes
        run: |
          sed -i 's/"it": "Sillabazione ungherese avanzata"/"it_IT": "Sillabazione ungherese avanzata"/' .github/scripts/apply_hungarian_kobo_build3.py
          python3 .github/scripts/apply_hungarian_kobo_build3.py
          grep -q 'Extended Hungarian hyphenation' frontend/apps/reader/modules/readertypography.lua
          grep -q 'huKnownFalseExtendedWord' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          git diff --check

      - name: Apply Hungarian Kobo build 4 fixes
        run: |
          python3 .github/scripts/apply_hungarian_kobo_build4.py
          grep -q 'getTextWidth(shaped_prefix.c_str()' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          grep -q 'not config:has("hungarian_extended_hyphenation")' frontend/apps/reader/modules/readertypography.lua
          git diff --check

      - name: Apply exact Hungarian rendered-prefix measurement
        run: |
          python3 .github/scripts/apply_hungarian_kobo_build12.py
          grep -q 'huRenderedPrefixWidth' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          grep -q 'candidate_width = rendered_prefix_width + _hyphen_width' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          grep -q 'word->width = rendered_prefix_width' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          git diff --check

      - name: Apply Hungarian full-context width fix
        run: |
          python3 .github/scripts/apply_hungarian_kobo_build13.py
          grep -q 'const lChar32 \* hu_source = srcline->t.text + word->t.start' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          grep -q 'int hu_source_len = srcline->t.len - word->t.start' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          grep -q 'hu_source, hu_source_len, word->t.len-1' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          git diff --check

      - name: Apply corrected CrossPoint Hungarian priority rules
        run: |
          python3 .github/scripts/apply_hungarian_kobo_build15.py
          grep -q 'huNearbyPatternBreakWins' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          grep -q 'meggyből' .github/scripts/apply_hungarian_kobo_build15.py
          grep -q 'bridzzsel' .github/scripts/apply_hungarian_kobo_build15.py
          grep -q 'eddzen' .github/scripts/apply_hungarian_kobo_build15.py
          grep -q 'rosszfiú' .github/scripts/apply_hungarian_kobo_build15.py
          grep -q 'hu_source, hu_source_len, word->t.len-1' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          git diff --check

      - name: Apply Hungarian Kobo build 16 language-priority fixes
        run: |
          HUNGARIAN_BUILD_NUMBER="${{ github.run_number }}" python3 .github/scripts/apply_hungarian_kobo_build16.py
          grep -q 'hu_pattern_flags_all' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          grep -q '_hyphen_width, 0xFFFF, 2' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          grep -q 'replacement_len > 1' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          grep -q 'Extended Hungarian hyphenation") .. " #${{ github.run_number }}"' frontend/apps/reader/modules/readertypography.lua
          grep -q 'hu_source, hu_source_len, word->t.len-1' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          ! grep -q '// bridzzsel' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          git diff --check

      - name: Apply Kobo build 17 dialogue-line and compact-menu fixes
        run: |
          HUNGARIAN_BUILD_NUMBER="${{ github.run_number }}" python3 .github/scripts/apply_hungarian_kobo_build17.py
          python3 .github/scripts/apply_hungarian_kobo_build17_finalize.py
          grep -q 'method = _("Extended Hungarian")' frontend/apps/reader/modules/readertypography.lua
          grep -q 'Extended Hungarian hyphenation") .. " #${{ github.run_number }}"' frontend/apps/reader/modules/readertypography.lua
          grep -q 'paragraph_dialogue_fix' frontend/ui/data/css_tweaks.lua
          grep -q 'dialogue-fix' frontend/ui/data/css_tweaks.lua
          grep -R -q 'CSS_CR_HINT_DIALOGUE_FIX' base/thirdparty/kpvcrlib/crengine/crengine/include
          grep -R -q 'CSS_CR_HINT_INHERITABLE_MASK        0x0000004E' base/thirdparty/kpvcrlib/crengine/crengine/include
          grep -q 'LTEXT_DIALOGUE_FIX' base/thirdparty/kpvcrlib/crengine/crengine/include/lvtextfm.h
          grep -q 'm_text\[dialogue_start\] == 0x2013' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          grep -q 'm_text\[dialogue_start\] == 0x2014' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          grep -q 'LCHAR_LOCKED_SPACING' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          ! grep -q 'LCHAR_IS_TO_IGNORE' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          grep -q 'hu_source, hu_source_len, word->t.len-1' base/thirdparty/kpvcrlib/crengine/crengine/src/lvtextfm.cpp
          git diff --check

      - name: Build Kobo package in official KOReader toolchain image
        run: |
          docker pull koreader/kokobo:latest
          docker run --rm \
            -v "$PWD:/home/ko/koreader" \
            -w /home/ko/koreader \
            -e CI=1 \
            -e MAKEFLAGS="VERSION=${KO_VERSION}" \
            koreader/kokobo:latest \
            bash -lc './kodev release --ignore-translation kobo zip'

      - name: Rename and verify Kobo package
        run: |
          set -eux
          mv koreader-kobo-*.zip "KOReader-Kobo-Hungarian-Build-${{ github.run_number }}-v2026.07.2.zip"
          ls -lh "KOReader-Kobo-Hungarian-Build-${{ github.run_number }}-v2026.07.2.zip"
          unzip -l "KOReader-Kobo-Hungarian-Build-${{ github.run_number }}-v2026.07.2.zip" | head -80

      - name: Upload Kobo artifact
        uses: actions/upload-artifact@v7
        with:
          name: KOReader-Kobo-Hungarian-Build-${{ github.run_number }}
          archive: false
          path: KOReader-Kobo-Hungarian-Build-${{ github.run_number }}-v2026.07.2.zip
          if-no-files-found: error
